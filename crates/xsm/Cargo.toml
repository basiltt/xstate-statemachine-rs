[package]
name = "xstate-statemachine-cli"
description = "Command-line tool for xstate-statemachine: validate, inspect, simulate, diagram and operate statecharts"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["command-line-utilities"]

[lib]
name = "xstate_statemachine_cli"
path = "src/lib.rs"

[[bin]]
name = "xsm"
path = "src/bin/xsm.rs"

[[bin]]
name = "xsm-rs"
path = "src/bin/xsm_rs.rs"

[dependencies]
xstate-core = { workspace = true }
xstate-persistence = { workspace = true, features = ["sqlite"] }
xstate-inspect = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
owo-colors = { workspace = true }
is-terminal = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
assert_cmd = "2.0"
predicates = "3.1"

[lints]
workspace = true
