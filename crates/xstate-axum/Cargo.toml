[package]
name = "xstate-axum"
description = "axum integration for xstate-core machines: registry, REST and per-event routes, SSE and WebSocket streaming, problem details, Stately Inspector endpoint"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["web-programming", "web-programming::http-server", "asynchronous"]

[dependencies]
xstate-core = { workspace = true }
xstate-persistence = { workspace = true, default-features = false }
xstate-inspect = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-stream = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
tower = { workspace = true }
http-body-util = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
