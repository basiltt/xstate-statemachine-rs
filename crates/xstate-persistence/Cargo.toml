[package]
name = "xstate-persistence"
description = "Stores, locks, durable timers, idempotency and audit log for xstate-core machines (Python-compatible snapshot layout v4)"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["database", "data-structures"]

[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite"]
redis = ["dep:redis"]
postgres = ["dep:sqlx", "dep:tokio"]

[dependencies]
xstate-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rusqlite = { workspace = true, optional = true }
redis = { workspace = true, features = ["script"], optional = true }
sqlx = { workspace = true, optional = true }
# `rt-multi-thread`: the owned runtime that `PostgresStore::connect` drives sqlx with must keep
# working when several threads call `block_on` at once (a current-thread runtime would let one
# waiting `lock()` poll starve the holder that has to release it).
tokio = { workspace = true, features = ["rt", "rt-multi-thread"], optional = true }
fd-lock = { workspace = true }
rand = { workspace = true }
percent-encoding = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
