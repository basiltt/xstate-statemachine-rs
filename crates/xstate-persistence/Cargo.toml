[package]
name = "xstate-persistence"
description = "Stores, locks, durable timers, idempotency and audit log for xstate-core machines (Python-compatible snapshot layout v4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite"]
redis = ["dep:redis"]

[dependencies]
xstate-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rusqlite = { workspace = true, optional = true }
redis = { workspace = true, features = ["script"], optional = true }
fd-lock = { workspace = true }
rand = { workspace = true }
percent-encoding = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
