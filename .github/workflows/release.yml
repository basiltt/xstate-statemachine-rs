name: Release

# Pushing a tag `vX.Y.Z` runs every gate, then a dry-run publish of each crate in dependency
# order (scripts/publish-order.txt). The real publish needs a human approval on the
# `crates-io` environment and the `CARGO_REGISTRY_TOKEN` secret.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  CARGO_INCREMENTAL: 0

jobs:
  tag-matches-version:
    name: tag matches the workspace version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the tag with [workspace.package] version
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml | head -n 1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi

  gates:
    name: gates (${{ matrix.os }})
    needs: tag-matches-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --all-features --locked
      - run: cargo test --workspace --doc --all-features --locked
      - run: cargo doc --workspace --no-deps --all-features --locked

  msrv:
    name: MSRV
    needs: tag-matches-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      # `postgres` (sqlx 0.9) needs Rust 1.94; every other feature honours the 1.88 MSRV.
      - run: cargo check --workspace --locked
      - run: cargo check -p xstate-statemachine --locked --features "tokio,sqlite,redis,eda,redis-streams,nats,rabbitmq,sqs,patterns,observability,inspect,macros,axum,agents,testing"

  deny:
    name: cargo-deny
    needs: tag-matches-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  publish-dry-run:
    name: cargo publish --dry-run
    needs: [gates, msrv, deny]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # One cargo invocation for the whole list: each crate is verified against its workspace
      # dependencies that are not on crates.io yet (see the header of the script).
      - run: bash scripts/publish.sh --dry-run

  publish:
    name: publish to crates.io
    needs: publish-dry-run
    if: github.repository == 'basiltt/xstate-statemachine-rs'
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/publish.sh --execute
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
