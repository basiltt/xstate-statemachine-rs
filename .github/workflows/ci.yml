name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by release.yml so that a release cannot be published past a red integration run.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  CARGO_INCREMENTAL: 0
  # The Python reference library is pinned to a released version so CI never tests against
  # unreleased Python behaviour. Bump both pins together with the conformance fixtures when a
  # newer Python release is ported.
  XSM_PYTHON_REQ: "xstate-statemachine==0.12.1"
  XSM_PYTHON_EXTRAS_REQ: "xstate-statemachine[redis,sqlalchemy,nats,rabbitmq,sqs]==0.12.1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked
      - run: cargo test --workspace --doc --all-features --locked
      # The conformance suite must also pass with the engine's single-transition fast path
      # compiled out, so every golden exercises the general microstep in CI.
      - run: cargo test -p xstate-conformance --no-default-features --locked

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      # `postgres` (sqlx 0.9) needs Rust 1.94; every other feature honours the 1.88 MSRV.
      - run: cargo check --workspace --locked
      - run: cargo check -p xstate-statemachine --locked --features "tokio,sqlite,redis,eda,redis-streams,nats,rabbitmq,sqs,patterns,observability,inspect,macros,axum,agents,testing"

  integration:
    name: integration (redis, postgres, nats, rabbitmq, sqs)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Real servers for the backend tests. XSM_REQUIRE_SERVICES=1 makes a backend test panic
    # instead of skipping when its service is unreachable; the log is also scanned below for
    # any "skipping ..." line as a second line of defence.
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xsm
          POSTGRES_PASSWORD: xsm
          POSTGRES_DB: xsm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U xsm -d xsm"
          --health-interval 5s --health-timeout 3s --health-retries 10
      rabbitmq:
        image: rabbitmq:3
        # `guest` may only connect from localhost inside the container, hence a dedicated user.
        env:
          RABBITMQ_DEFAULT_USER: xsm
          RABBITMQ_DEFAULT_PASS: xsm
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 12
      elasticmq:
        image: softwaremill/elasticmq-native
        ports: ["9324:9324"]
    env:
      XSM_REQUIRE_SERVICES: "1"
      XSM_REDIS_URL: redis://127.0.0.1:6379/
      XSM_POSTGRES_URL: postgres://xsm:xsm@127.0.0.1:5432/xsm
      XSM_NATS_URL: nats://127.0.0.1:4222
      XSM_AMQP_URL: amqp://xsm:xsm@127.0.0.1:5672/%2f
      XSM_SQS_ENDPOINT: http://127.0.0.1:9324
      XSM_PYTHON: ${{ github.workspace }}/.venv-py/bin/python
    steps:
      - uses: actions/checkout@v4
      # `services:` cannot pass arguments to the container command, and NATS needs `-js`
      # (JetStream), so this one is started by hand.
      - name: Start NATS with JetStream
        run: docker run -d --name nats -p 4222:4222 nats:2 -js
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The cross-language tests (Rust writes, Python reads, and back) need the Python library.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the Python library for the cross-language tests
        run: |
          python -m venv .venv-py
          .venv-py/bin/python -m pip install --upgrade pip
          .venv-py/bin/python -m pip install \
            "${XSM_PYTHON_EXTRAS_REQ}" \
            "psycopg[binary]"
      - name: Wait for the services
        run: |
          for port in 6379 5432 4222 5672 9324; do
            for _ in $(seq 1 60); do
              (echo >"/dev/tcp/127.0.0.1/$port") 2>/dev/null && break
              sleep 2
            done
            (echo >"/dev/tcp/127.0.0.1/$port") 2>/dev/null || { echo "port $port is not up"; exit 1; }
          done
      - name: Test the workspace with every backend
        run: |
          set -o pipefail
          cargo test --workspace --all-features --locked -- --nocapture 2>&1 | tee test.log
      - name: Fail if a backend test skipped for a missing service
        run: |
          if grep -E '^[[:space:]]*skipping' test.log; then
            echo "::error::a test skipped itself; with XSM_REQUIRE_SERVICES=1 nothing may skip"
            exit 1
          fi

  bench-gate:
    name: benchmarks and perf gate (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Compiles every criterion benchmark so they cannot rot.
      - run: cargo bench --workspace --benches --no-run --locked
      - name: budgets.json is valid JSON
        run: node -e 'JSON.parse(require("fs").readFileSync("benches/budgets.json", "utf8"))'
      # Runs the engine benchmarks and compares them with benches/budgets.json. Advisory:
      # hosted runners are not the machine the baselines were recorded on and vary from run to
      # run, so the table is printed but a regression does not fail the job (benches/README.md).
      - name: perf gate (advisory, relative)
        run: python3 scripts/perf_gate.py --advisory --relative -- --warm-up-time 1 --measurement-time 3

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # The 90% gate (--fail-under-lines 90) is enabled once the engine lands in Phase 1.
      - run: cargo llvm-cov --workspace --all-features --locked --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  conformance-fixtures:
    name: conformance fixtures are fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install oracles
        run: |
          npm ci --prefix conformance/tools/xstate_oracle
          python -m pip install --upgrade pip
          python -m pip install "${XSM_PYTHON_REQ}"
      - name: Regenerate expectations
        run: |
          python conformance/tools/generate_expected.py --check
      - name: Regenerate the Mermaid / PlantUML goldens
        run: |
          python conformance/tools/export_golden.py --check

  python-bindings:
    name: python bindings (xstate-py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the extension and run its tests
        run: |
          python -m venv .venv-bindings
          .venv-bindings/bin/python -m pip install --upgrade pip maturin pytest
          export VIRTUAL_ENV="$PWD/.venv-bindings" PATH="$PWD/.venv-bindings/bin:$PATH"
          (cd crates/xstate-py && maturin develop --release)
          python -m pytest crates/xstate-py/tests

  facade-only:
    name: macros work through the facade alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A project that depends on `xstate-statemachine` and nothing else must be able to use
      # the derive macros and the `statechart!` DSL.
      - name: cargo check the facade-only project
        run: |
          dir=crates/xstate-macros/tests/facade-only
          if [ -d "$dir" ]; then
            cargo check --manifest-path "$dir/Cargo.toml" --all-targets
          else
            echo "::warning::$dir does not exist; nothing to check"
          fi
