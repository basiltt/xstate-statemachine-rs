[workspace]
resolver = "3"
members = [
    "crates/xstate-core",
    "crates/xstate-tokio",
    "crates/xstate-persistence",
    "crates/xstate-testing",
    "crates/xstate-conformance",
    "crates/xsm",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Basil T T"]
repository = "https://github.com/basiltt/xstate-statemachine-rs"
homepage = "https://github.com/basiltt/xstate-statemachine-rs"
keywords = ["statechart", "state-machine", "xstate", "scxml", "fsm"]
categories = ["data-structures", "asynchronous", "simulation"]

[workspace.dependencies]
# internal crates
xstate-core = { path = "crates/xstate-core", version = "0.0.1" }
xstate-tokio = { path = "crates/xstate-tokio", version = "0.0.1" }
xstate-persistence = { path = "crates/xstate-persistence", version = "0.0.1" }
xstate-testing = { path = "crates/xstate-testing", version = "0.0.1" }

# core
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
tracing = { version = "0.1", default-features = false, features = ["std"] }
smallvec = { version = "1.13", features = ["union", "const_generics"] }
indexmap = { version = "2.6", features = ["serde"] }
fixedbitset = "0.5"
smol_str = { version = "0.3", features = ["serde"] }
foldhash = "0.1"
sha2 = "0.10"
hex = "0.4"

# async
tokio = { version = "1.40", default-features = false }

# persistence
rusqlite = { version = "0.33", features = ["bundled"] }
fd-lock = "4.0"
rand = "0.9"
tempfile = "3.14"
percent-encoding = "2.3"

# cli
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"

# dev
proptest = "1.5"
insta = { version = "1.40", features = ["json"] }
criterion = { version = "0.5", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
# pedantic lints that fight readability in this codebase
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = false
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true
strip = "none"
