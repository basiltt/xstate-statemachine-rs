[workspace]
resolver = "3"
members = [
    "crates/xstate-core",
    "crates/xstate-tokio",
    "crates/xstate-persistence",
    "crates/xstate-testing",
    "crates/xstate-conformance",
    "crates/xstate-inspect",
    "crates/xstate-observability",
    "crates/xstate-eda",
    "crates/xstate-patterns",
    "crates/xstate-macros",
    "crates/xstate-axum",
    "crates/xstate-agents",
    "crates/xstate-statemachine",
    "crates/xstate-py",
    "crates/xsm",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Basil T T"]
repository = "https://github.com/basiltt/xstate-statemachine-rs"
homepage = "https://github.com/basiltt/xstate-statemachine-rs"
keywords = ["statechart", "state-machine", "xstate", "scxml", "fsm"]
categories = ["data-structures", "asynchronous", "simulation"]

[workspace.dependencies]
# internal crates
xstate-core = { path = "crates/xstate-core", version = "0.1.1" }
xstate-tokio = { path = "crates/xstate-tokio", version = "0.1.1" }
# default-features = false: member crates opt in (xsm enables `sqlite`); with the key absent here, a
# member's `default-features = false` is an error on cargo 1.88 (the MSRV).
xstate-persistence = { path = "crates/xstate-persistence", version = "0.1.1", default-features = false }
xstate-testing = { path = "crates/xstate-testing", version = "0.1.1" }
xstate-inspect = { path = "crates/xstate-inspect", version = "0.1.1" }
xstate-observability = { path = "crates/xstate-observability", version = "0.1.1" }
xstate-eda = { path = "crates/xstate-eda", version = "0.1.1", default-features = false }
xstate-patterns = { path = "crates/xstate-patterns", version = "0.1.1" }
xstate-macros = { path = "crates/xstate-macros", version = "0.1.1" }
xstate-axum = { path = "crates/xstate-axum", version = "0.1.1" }
xstate-agents = { path = "crates/xstate-agents", version = "0.1.1" }
xstate-statemachine = { path = "crates/xstate-statemachine", version = "0.1.1" }

# core
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
thiserror = "2.0"
tracing = { version = "0.1", default-features = false, features = ["std"] }
smallvec = { version = "1.13", features = ["union", "const_generics"] }
indexmap = { version = "2.6", features = ["serde"] }
fixedbitset = "0.5"
smol_str = { version = "0.3", features = ["serde"] }
foldhash = "0.1"
sha2 = "0.10"
hex = "0.4"

# async
tokio = { version = "1.40", default-features = false }

# persistence
rusqlite = { version = "0.33", features = ["bundled"] }
redis = { version = "0.32", default-features = false, features = ["tokio-comp", "connection-manager"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "chrono"] }

# brokers
async-nats = "0.50"
lapin = "3.6"
aws-config = { version = "1.8", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-sdk-sqs = { version = "1.93", default-features = false, features = ["rt-tokio", "default-https-client"] }

# python bindings
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
fd-lock = "4.0"
rand = "0.9"
tempfile = "3.14"
percent-encoding = "2.3"

# cli
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
owo-colors = "4.1"
is-terminal = "0.4"

# http
axum = { version = "0.8", features = ["ws", "json", "macros"] }
tower = { version = "0.5", features = ["util"] }
http = "1.3"
http-body-util = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# proc-macros
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
proc-macro-crate = "3.5"

# observability
metrics = "0.24"
uuid = { version = "1.11", features = ["v4", "v7"] }

# dev
proptest = "1.5"
insta = { version = "1.40", features = ["json"] }
criterion = { version = "0.5", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
# pedantic lints that fight readability in this codebase
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

# Line tables are enough for backtraces and keep `target/` an order of magnitude smaller than
# full debuginfo across this many crates and feature combinations.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = false
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true
strip = "none"
