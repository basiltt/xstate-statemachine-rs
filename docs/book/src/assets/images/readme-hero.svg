<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">xstate-statemachine — Make every event count.</title>
  <desc id="description">Visual statecharts. Blazing Fast Rust. An order moves from placed to paid to fulfilled as events arrive. Design once, execute in 106 ns, observe the workflow.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b131f"/>
      <stop offset="1" stop-color="#142338"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#38bdf8" stop-opacity=".18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#93c5fd" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1200" height="440" rx="20" fill="url(#background)"/>
  <rect width="1200" height="440" rx="20" fill="url(#grid)"/>
  <ellipse cx="990" cy="205" rx="360" ry="265" fill="url(#glow)"/>
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <g transform="translate(56 43)" fill="none" stroke="#38bdf8" stroke-width="2">
      <path d="M7 7H28V28H49"/>
      <circle cx="7" cy="7" r="5" fill="#0b131f"/>
      <circle cx="28" cy="28" r="5" fill="#0b131f"/>
      <circle cx="49" cy="28" r="5" fill="#38bdf8"/>
    </g>
    <text x="128" y="66" fill="#e0f2fe" font-size="19" font-weight="600" letter-spacing=".4">xstate-statemachine-rs</text>
    <text x="56" y="166" fill="#f8fafc" font-size="74" font-weight="700" letter-spacing="-3">Make every</text>
    <text x="56" y="244" fill="url(#accent)" font-size="74" font-weight="700" letter-spacing="-3">event count.</text>
    <text x="59" y="295" fill="#94a3b8" font-size="23">Visual statecharts. Blazing Fast Rust.</text>
    <text x="59" y="380" fill="#38bdf8" font-size="13" font-weight="600" letter-spacing="2.4">106 NS TRANSITIONS · ZERO ALLOCATIONS · XSTATE V5</text>
    <g transform="translate(686 94)">
      <rect width="458" height="245" rx="16" fill="#0f172a" stroke="#1e293b"/>
      <path d="M0 56H458" stroke="#1e293b"/>
      <circle cx="25" cy="28" r="4" fill="#38bdf8"/>
      <text x="41" y="34" fill="#e2e8f0" font-size="16" font-weight="600">order.workflow</text>
      <rect x="340" y="17" width="99" height="23" rx="11.5" fill="#1e293b"/>
      <text x="389" y="33" fill="#38bdf8" font-size="11" font-weight="600" letter-spacing="1" text-anchor="middle">RUNNING</text>
      <text x="24" y="92" fill="#64748b" font-size="13" letter-spacing="1.3">EVENT IN. NEXT STATE OUT (106 NS).</text>
      <path d="M127 138H172M285 138H327" fill="none" stroke="#334155" stroke-width="2"/>
      <path d="M165 133L172 138L165 143M320 133L327 138L320 143" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <rect x="24" y="113" width="105" height="49" rx="9" fill="#1e293b" stroke="#334155"/>
      <text x="76" y="143" fill="#cbd5e1" font-size="16" text-anchor="middle">placed</text>
      <rect x="173" y="113" width="110" height="49" rx="9" fill="#38bdf8"/>
      <text x="228" y="143" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">paid</text>
      <rect x="328" y="113" width="106" height="49" rx="9" fill="#1e293b" stroke="#334155"/>
      <text x="381" y="143" fill="#cbd5e1" font-size="16" text-anchor="middle">fulfilled</text>
      <path d="M24 191H434" stroke="#1e293b"/>
      <text x="24" y="221" fill="#38bdf8" font-size="13" font-family="Cascadia Code, Consolas, monospace">order.send_and_wait("PAY").await?; // 1.13 µs</text>
    </g>
    <text x="1143" y="380" fill="#94a3b8" font-size="13" font-weight="600" letter-spacing="2" text-anchor="end">RUST · XSTATE · PYTHON PARITY · APACHE/MIT</text>
  </g>
  <path d="M22 439H1178" stroke="url(#accent)" stroke-opacity=".55"/>
</svg>
