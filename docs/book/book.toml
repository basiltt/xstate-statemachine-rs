[book]
authors = ["Basil T T"]
language = "en"
src = "src"
title = "xstate-statemachine-rs"
description = "High-performance, visual statecharts for Rust. 69.8 ns transitions, 0 heap allocations, 100% XState v5 compatible with Tokio actors, durable persistence, and EDA."

[output.html]
theme = "theme"
default-theme = "dark"
preferred-dark-theme = "dark"
additional-css = [
    "src/theme/style.css",
    "src/theme/custom.css"
]
additional-js = [
    "src/theme/main.js",
    "src/theme/diagrams.js"
]
git-repository-url = "https://github.com/basiltt/xstate-statemachine-rs"
edit-url-template = "https://github.com/basiltt/xstate-statemachine-rs/edit/main/{path}"
