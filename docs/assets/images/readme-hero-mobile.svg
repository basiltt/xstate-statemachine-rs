<svg xmlns="http://www.w3.org/2000/svg" width="640" height="540" viewBox="0 0 640 540" role="img" aria-labelledby="title description">
  <title id="title">xstate-statemachine — Make every event count.</title>
  <desc id="description">Visual statecharts. Blazing Fast Rust. 69.8 ns transitions. An order moves from placed to paid to fulfilled as events arrive.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b131f"/>
      <stop offset="1" stop-color="#142338"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="640" height="540" rx="18" fill="url(#background)"/>
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <circle cx="44" cy="48" r="5" fill="#38bdf8"/>
    <text x="64" y="56" fill="#e0f2fe" font-size="24" font-weight="600">xstate-statemachine-rs</text>
    <text x="38" y="157" fill="#f8fafc" font-size="76" font-weight="700" letter-spacing="-3">Make every</text>
    <text x="38" y="239" fill="url(#accent)" font-size="76" font-weight="700" letter-spacing="-3">event count.</text>
    <text x="42" y="292" fill="#94a3b8" font-size="27">Visual statecharts. Blazing Fast Rust.</text>
    <g transform="translate(40 336)">
      <rect width="560" height="126" rx="14" fill="#0f172a" stroke="#1e293b"/>
      <text x="24" y="34" fill="#64748b" font-size="17" letter-spacing="1">EVENT IN. NEXT STATE OUT (69.8 NS).</text>
      <path d="M170 80H211M351 80H391" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <path d="M203 74L211 80L203 86M383 74L391 80L383 86" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <rect x="24" y="56" width="146" height="48" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="97" y="87" fill="#cbd5e1" font-size="23" text-anchor="middle">placed</text>
      <rect x="212" y="56" width="139" height="48" rx="8" fill="#38bdf8"/>
      <text x="281" y="87" fill="#0f172a" font-size="23" font-weight="700" text-anchor="middle">paid</text>
      <rect x="392" y="56" width="144" height="48" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="464" y="87" fill="#cbd5e1" font-size="23" text-anchor="middle">fulfilled</text>
    </g>
    <text x="42" y="505" fill="#38bdf8" font-size="17" font-weight="600" letter-spacing="1.8">RUST · XSTATE · PYTHON PARITY · 69.8 NS</text>
  </g>
</svg>
