msrv = "1.88"
too-many-lines-threshold = 120
cognitive-complexity-threshold = 25
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true

# Product names clippy would otherwise want in backticks.
doc-valid-idents = ["XState", "SCXML", "CloudEvents", "OpenTelemetry", "WebSocket", "AsyncAPI", "RabbitMQ", "SQLite", "PostgreSQL", "MySQL", ".."]
